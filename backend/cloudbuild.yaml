steps:
  # 1. Build the backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nestjs-backend:$COMMIT_SHA',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nestjs-backend:latest',
      './backend'
    ]

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nestjs-backend:$COMMIT_SHA'
    ]

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'nestjs-backend',
      '--image', 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nestjs-backend:$COMMIT_SHA',
      '--region', 'asia-south1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-env-vars', 'NODE_ENV=production,DB_USERNAME=postgres,DB_PASSWORD=Gcpowner@2403,DB_NAME=task_tracker_poc',
      '--max-instances', '1',
      '--timeout', '180',
      '--memory', '512Mi'
    ]

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nestjs-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: 'projects/project-708e77f4-583e-48a4-807/serviceAccounts/358045803121-compute@developer.gserviceaccount.com'